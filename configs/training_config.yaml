# Training configuration for the published multimodal model.
# Reference values — the scripts currently set these inline; this file documents
# the configuration used for the results reported in the paper.

multimodal_pft:
  # Optimal configuration (Table 3): EfficientNet-B0 + MLP, FiLM fusion
  image_backbone: efficientnet_b0     # timm, ImageNet-pretrained
  tabular_encoder: mlp                # TabularMLP, hidden (128, 64)
  fusion: film                        # FiLMFusion
  input_resolution: [512, 512]
  input_channels: 3                   # grayscale radiograph replicated 3x
  tasks: [FVC_abnormal, FEV1_abnormal]  # multi-task, binary each

  optimizer: AdamW
  base_learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  lr_scheduler: cosine_annealing_warm_restarts   # T_0=10, T_mult=2
  loss: BCEWithLogitsLoss               # pos_weight per task, from the train split
  batch_size: 16
  total_epochs: 100
  early_stopping_patience: 10
  early_stopping_criterion: validation_loss
  checkpoint_selection: lowest_validation_loss
  classification_threshold: 0.5         # Youden's J also reported as "tuned"

  tabular_normalization: z-score, statistics from the training split only

  augmentation:
    geometric:
      - resize_512
      - random_affine: {degrees: 10, translate: [0.1, 0.1], scale: [0.5, 1.5], shear: 0.0, p: 0.5}
      - random_resized_crop: {size: 512, scale: [0.8, 1.0], ratio: [0.9, 1.1]}
      - random_horizontal_flip: {p: 0.5}
    intensity:
      - color_jitter: {brightness: 0.2, contrast: 0.2, saturation: 0.0, hue: 0.0, p: 0.3}
    batch_level:
      - mixup_cutmix: {mixup_alpha: 0.8, cutmix_alpha: 1.0, prob: 0.5, switch_prob: 0.5}
    normalization: imagenet_mean_std

ablations:
  # Table 4 — every combination trained with the same splits and schedule
  image_backbones: [vgg19_bn, resnet50, densenet121, efficientnet_b0, convnext_base]
  tabular_encoders: [mlp, cnn]        # TabularMLP, TabularCNN1D
  fusion_strategies: [image_only, concat, attention, film]

preprocessing:
  windowing: DICOM WindowCenter / WindowWidth, MONOCHROME1 inverted
  burned_in_text: removed by top-hat detection + Telea inpainting (upper ROI, 2 passes)
  histogram_matching:
    reference: a fixed training-set radiograph (never a validation case)
  clahe: {impl: cv2.createCLAHE, clip_limit: 2.0, tile_grid: [8, 8]}
  resize: [512, 512]

cross_validation:
  strategy: multilabel-stratified k-fold     # iterstrat.MultilabelStratifiedKFold
  stratified_on: [FVC_class, FEV1_class]     # preserves the joint label distribution
  n_splits: 5
  shuffle: true
  random_state: 42
  patients: 178

outcomes:
  definition: < 80% of predicted value
  reference_equations: GLI-2012, northeast Asian, adjusted for age, sex, height
  class_balance:
    FVC:  {normal: 104, abnormal: 74}
    FEV1: {normal: 60,  abnormal: 118}
